[package]
name = "xcalendar"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "A calendar application for the COSMIC Desktop"
repository = "https://github.com/JadeJitsu/Calendar"

[dependencies]
# COSMIC framework with all recommended features
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "822d3b2a0f", default-features = false, features = [
    "a11y",           # Accessibility support
    "about",          # About dialog widget
    "dbus-config",    # Config file change watching via cosmic-settings-daemon
    "multi-window",   # Multi-window support (required for single-instance)
    "tokio",          # Tokio async runtime
    "wayland",        # Wayland support
    "winit",          # Windowing system
    "wgpu",           # GPU-accelerated rendering
] }

# Async runtime
tokio = { version = "1", features = ["sync", "rt"] }
futures-util = "0.3"

# Date/Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# jiff is used at the libcosmic calendar() widget boundary (it migrated from chrono to jiff)
jiff = "0.2"

# Calendar formats
icalendar = { version = "0.16", features = ["chrono-tz"] }

# System keyring for CalDAV credentials (secret-service / GNOME Keyring / KWallet)
keyring = "4"

# XML parsing for CalDAV multistatus responses
roxmltree = "0.20"

# HTTP client for CalDAV and URL downloads
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "charset", "http2"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# System directories
dirs = "5.0"

# Desktop notifications for event alerts
notify-rust = "4"

# System tray icon (StatusNotifierItem on Wayland/COSMIC). default-features off
# to skip the `libxdo` dependency (keyboard accelerators, which we don't use) —
# it would otherwise require the libxdo system library at link time.
tray-icon = { version = "0.19", default-features = false }

# Decode the bundled PNG tray icon to RGBA (already in the lock as a transitive dep)
png = "0.17"

# Linux tray backend is libappindicator (GTK3): the StatusNotifierItem only
# registers once a GTK main loop is running, so we spawn a thread that inits
# GTK and pumps it. Version must match what libappindicator 0.9 pulls in (0.18)
# to avoid a second gtk-sys in the tree.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# File dialogs (with XDG portal support for Flatpak)
rfd = "0.15"

# URL parsing
url = "2.5"

# Internationalization
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.8"
lazy_static = "1.5"

# Open URLs/files
open = "5.3"

# UUID generation for event IDs
uuid = { version = "1.11", features = ["v4"] }

# SQLite database with SQLCipher encryption support
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Command-line argument parsing
clap = { version = "4.5", features = ["derive"] }

# Note: cosmic-text resolves to 0.19.0 via Cargo.lock (pulled in by libcosmic).
# The libcosmic rev bump to 19f4a28 moved cosmic-text 0.15 -> 0.19 and the iced
# API (calendar() now uses jiff, text_input callbacks are closures, AbsoluteOffset
# fields are Option). Do not update libcosmic without re-verifying these.
#
# The pin was bumped 19f4a28 -> 822d3b2a0f (2026-07-01, "chore: update
# cosmic-protocols") because 19f4a28 pulled cosmic-client-toolkit at cosmic-protocols
# rev a7d2d7a while its iced crates pulled cosmic-protocols at 32283d7 — two revs of
# the same git repo, which the Flatpak vendor step cannot represent (it maps both to
# one cargo/vendor dir and fails). 822d3b2a0f aligns the root cctk pin to 32283d7,
# collapsing the graph to a single rev. That bump dropped the `Task` re-export the
# dbus_activation method relied on, so it now imports `cosmic::app::Task` explicitly.

# `dpi` is pulled from two sources at the same name+version: crates.io (via
# `muda`) and the pop-os/winit git repo (winit's path dep). The Flatpak vendor
# step keys packages by name+version and can't hold both, so redirect the
# crates.io copy to the git source (same upstream crate, same 0.1.2) to collapse
# the graph to a single `dpi`.
[patch.crates-io]
dpi = { git = "https://github.com/pop-os/winit.git", tag = "cosmic-0.14" }

[features]
# Single-instance support via D-Bus (disabled by default due to system compatibility issues)
# Enable with: cargo build --features single-instance
# Or disable at runtime with: COSMIC_SINGLE_INSTANCE=false sol-calendar
single-instance = ["libcosmic/single-instance"]

# Debug aid: live CalDAV discovery probe. Not part of the test suite —
# it includes caldav.rs standalone, which can't see the rest of the crate.
[[bin]]
name = "caldav_probe"
path = "src/bin/caldav_probe.rs"
test = false

[[bin]]
name = "ocs_probe"
path = "src/bin/ocs_probe.rs"
test = false

[[bin]]
name = "report_probe"
path = "src/bin/report_probe.rs"
test = false

[[bin]]
name = "list_probe"
path = "src/bin/list_probe.rs"
test = false

# Lower optimization for the bundled SQLCipher C build only — compiling its
# amalgamated source at -O3 spikes memory well past what this machine's RAM
# can sustain alongside a running browser. This does not weaken encryption,
# only how hard the C compiler optimizes the resulting code.
[profile.release.package.libsqlite3-sys]
opt-level = 0
