app-id: dev.jadejitsu.apps.Calendar
version: "0.4.1"
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: xcalendar

finish-args:
  # IPC and display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # D-Bus access for COSMIC desktop integration
  - --socket=session-bus
  - --talk-name=com.system76.CosmicSettings
  - --talk-name=com.system76.CosmicSettingsDaemon
  - --talk-name=com.system76.CosmicTheme
  - --talk-name=com.system76.CosmicTheme.*

  # System tray icon (StatusNotifierItem): libappindicator must be able to
  # register with the desktop's StatusNotifierWatcher over the session bus.
  - --talk-name=org.kde.StatusNotifierWatcher

  # COSMIC config access for theme switching
  - --filesystem=xdg-config/cosmic:ro

  # Filesystem access for calendar import/export
  - --filesystem=xdg-documents:rw
  - --filesystem=xdg-download:rw

  # Network access for webcal:// and ics:// URL downloads
  - --share=network

  # D-Bus access for URL handler registration
  - --talk-name=org.freedesktop.Flatpak
  - --own-name=dev.jadejitsu.apps.Calendar

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/xcalendar/cargo
    FLATPAK_ID: dev.jadejitsu.apps.Calendar

modules:
  # System tray icon backend: tray-icon's Linux/GTK3 backend links against
  # libayatana-appindicator3 (StatusNotifierItem via GTK's D-Bus loop) at
  # build time via pkg-config. The org.freedesktop.Platform runtime does not
  # ship this library, so it must be built into /app before xcalendar links
  # against it. Module definition + patches vendored from
  # github.com/flathub/shared-modules (the standard, widely-reused Flatpak
  # module for this exact dependency chain).
  - flatpak-shared-modules/libayatana-appindicator-gtk3.json

  - name: xcalendar
    buildsystem: simple
    # Dependencies are vendored via cargo-sources.json (generated from Cargo.lock
    # by scripts/flatpak-cargo-generator.py) so the build is fully offline —
    # no in-sandbox network, which is both faster and avoids libgit2's DNS
    # failures and GitHub's refusal to serve arbitrary commit SHAs.
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose --features single-instance
      - install -Dm755 ./target/release/xcalendar -t /app/bin/
      - install -Dm644 ./res/dev.jadejitsu.apps.Calendar.desktop /app/share/applications/dev.jadejitsu.apps.Calendar.desktop
      - install -Dm644 ./res/dev.jadejitsu.apps.Calendar.metainfo.xml /app/share/metainfo/dev.jadejitsu.apps.Calendar.metainfo.xml
      - install -Dm644 ./res/icons/hicolor/scalable/apps/dev.jadejitsu.apps.Calendar.svg /app/share/icons/hicolor/scalable/apps/dev.jadejitsu.apps.Calendar.svg

    sources:
      - type: dir
        path: .
        # The `dir` source copies the raw directory (no .gitignore awareness),
        # so exclude the local build artifacts — `target/` alone is ~23 GB and
        # the sandbox compiles fresh anyway.
        skip:
          - target
          - .git
          - build-dir
          - flatpak-repo
          - .flatpak-builder
      - cargo-sources.json
